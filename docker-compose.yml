services:
  postgres:
    image: postgres:15
    container_name: marketplace_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: marketplace_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always

  metabase:
    image: metabase/metabase:latest
    container_name: marketplace_metabase
    ports:
      - "3000:3000" # Metabase будет доступен на http://localhost:3000
    environment:
      - MB_DB_TYPE=h2 # Встроенная база данных (для учебного проекта пойдет)
    volumes:
      - metabase_data:/metabase-data
    restart: always
    
  airflow:
    build: .
    container_name: airflow_standalone
    depends_on:
      - postgres
      - clickhouse
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow_db
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_ADMIN_USER=${AIRFLOW_ADMIN_USER}
      - AIRFLOW_ADMIN_EMAIL=${AIRFLOW_ADMIN_EMAIL}
      - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./tests:/opt/airflow/tests 
      - ./webserver_config.py:/opt/airflow/webserver_config.py 
    command: bash -c "airflow db migrate && airflow standalone"
    restart: always

volumes:
  postgres_data:
  clickhouse_data:
  metabase_data: