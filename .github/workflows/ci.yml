name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Run pytest in container
        # Запускаем тесты внутри контейнера airflow, где установлены Spark и pytest
        run: docker compose run --rm airflow python -m pytest tests/ -v